# Ten plik jest zapisany w kodowaniu UTF-8 bez znacznika BOM.
[KeyboardKeys]
	# Znaki klawiszy używane w oknie wybiórczego ogłaszania klawiszy poleceń.
	# Kolejność odpowiada kolejności prezentacji klawiszy w oknie.
	keys = "abcdefghijklmnopqrstuvwxyz0123456789-=[];'\,./"
[editionKeyCommands]
	[[default]]
		# Standardowe polecenia edycji systemu Windows.
		copy = control+c
		cut = control+x
		paste = control+v
		undo = control+z
		selectAll = control+a
